    method: "POST",

function TestScreen({ week, type, onSubmit, onCancel }) {
  const test = week[type];
  const [answers, setAnswers] = useState({});
  const totalQ = TOTAL_Q(test);
  const answeredCount = Object.keys(answers).length;

  let qCounter = 0;

  const select = (qKey, idx) => setAnswers((a) => ({ ...a, [qKey]: idx }));

  const submit = () => {
    let correct = 0;
    let counter = 0;
    test.passages.forEach((p, pi) => {
      p.questions.forEach((q, qi) => {
        const key = `${pi}-${qi}`;
        if (answers[key] === q.correct) correct++;
        counter++;
      });
    });
    onSubmit({ correct, total: counter, percent: Math.round((correct / counter) * 100), answers });
  };

  return (
    <div className="mx-auto max-w-3xl px-4 py-8 f-body">
      <button onClick={onCancel} className="mb-4 flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-700">
        <ArrowLeft size={15} /> Kembali ke menu
      </button>

      <div className="mb-6 flex items-center justify-between rounded-2xl bg-slate-900 px-5 py-4 text-amber-50">
        <div>
          <p className="f-mono text-xs font-bold uppercase tracking-wide text-amber-400">
            Week {String(week.id).padStart(2, "0")} · {type === "pretest" ? "Pretest" : "Posttest"}
          </p>
          <p className="f-display text-lg font-semibold">{week.topic}</p>
          <p className="text-xs text-slate-400">{week.tenseLabel}</p>
        </div>
        <div className="f-mono text-right text-sm font-bold text-amber-400">
          {answeredCount}/{totalQ}
          <div className="text-xs font-normal text-slate-400">terjawab</div>
        </div>
      </div>

      {test.passages.map((p, pi) => (
        <div key={pi} className="mb-8">
          <TicketCard className="p-5" style={{ background: "#FFFBEB" }}>
            <div className="flex items-center gap-2 text-amber-600">
              <BookOpen size={16} />
              <span className="f-mono text-xs font-bold uppercase tracking-wide">Reading {pi + 1}</span>
            </div>
            <h3 className="f-display mt-1 text-lg font-semibold text-slate-800">{p.title}</h3>
            <p className="mt-2 text-sm leading-relaxed text-slate-600">{p.text}</p>
          </TicketCard>

          <div className="mt-4 space-y-4">
            {p.questions.map((q, qi) => {
              qCounter++;
              const key = `${pi}-${qi}`;
              return (
                <div key={key} className="rounded-xl border border-slate-200 bg-white p-4">
                  <p className="text-sm font-semibold text-slate-800">
                    <span className="f-mono text-amber-600">{qCounter}.</span> {q.q}
                  </p>
                  <div className="mt-3 space-y-2">
                    {q.options.map((opt, oi) => {
                      const active = answers[key] === oi;
                      return (
                        <button
                          key={oi}
                          onClick={() => select(key, oi)}

const TEST_LABEL = { pretest: "Pretest", posttest: "Posttest" };

function rankStudents(students) {
  return students
    .map((s) => {
      const percents = [];
      WEEKS.forEach((w) => {
        const sc = s.scores?.[w.id];
        if (sc?.pretest) percents.push(sc.pretest.percent);
        if (sc?.posttest) percents.push(sc.posttest.percent);
      });
      const avg = percents.length ? Math.round(percents.reduce((a, b) => a + b, 0) / percents.length) : 0;
      return { ...s, avg, completed: percents.length };
    })
    .sort((a, b) => b.avg - a.avg || b.completed - a.completed);
}

function buildCsv(students) {
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["No", "Nama", "NIM", "Tes Selesai", "Rata-rata (%)"];
  WEEKS.forEach((w) =>
    ["pretest", "posttest"].forEach((t) => {
      head.push(`W${w.id} ${TEST_LABEL[t]} - Skor (%)`, `W${w.id} ${TEST_LABEL[t]} - Selesai pada`);
      let n = 0;
      w[t].passages.forEach((p) => p.questions.forEach(() => head.push(`W${w.id} ${TEST_LABEL[t]} - Soal ${++n}`)));
    })
  );
  const rows = rankStudents(students).map((s, i) => {
    const row = [i + 1, s.nama, s.nim, `${s.completed}/${WEEKS.length * 2}`, s.avg];
    WEEKS.forEach((w) =>
      ["pretest", "posttest"].forEach((t) => {
        const sc = s.scores?.[w.id]?.[t];
        row.push(sc ? sc.percent : "", sc?.completedAt || "");
        w[t].passages.forEach((p, pi) =>
          p.questions.forEach((qq, qi) => {
            if (!sc) return row.push("");
            const a = sc.answers?.[`${pi}-${qi}`];
            row.push(a === undefined ? "Kosong" : a === qq.correct ? "Benar" : "Salah");
          })
        );
      })
    );
    return row;
  });
  return [head, ...rows].map((r) => r.map(q).join(",")).join("\r\n");
}

    setBusy(true);
    const ok = await onLogin(pw);
    setBusy(false);
    if (ok) { setErr(""); setPw(""); } else setErr("Password salah atau server tidak terjangkau.");
  };

  const downloadCsv = () => {
    try {
      const blob = new Blob(["\ufeff" + buildCsv(students)], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `rekap-cei-links-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setMsg("Rekap diunduh. Jika file tidak muncul, gunakan tombol Salin CSV lalu tempel ke Excel/Sheets.");
    } catch (e) {
      setMsg("Download diblokir browser. Gunakan tombol Salin CSV.");

  const copyCsv = async () => {
    try {
      await navigator.clipboard.writeText(buildCsv(students));

    } catch (e) {

function App() {
  const [view, setView] = useState("landing");
  const [student, setStudent] = useState(null);
  const [record, setRecord] = useState(null);
  const [prefill, setPrefill] = useState({ nama: "", nim: "" });
  const [activeWeekId, setActiveWeekId] = useState(null);
  const [activeType, setActiveType] = useState(null);
  const [lastResult, setLastResult] = useState(null);
  const [students, setStudents] = useState([]);
  const [lbLoading, setLbLoading] = useState(false);
  const [printWeekId, setPrintWeekId] = useState(null);
  const [adminOk, setAdminOk] = useState(false);
  const [adminPw, setAdminPw] = useState("");

  useEffect(() => {
    const handleAfterPrint = () => setPrintWeekId(null);
    window.addEventListener("afterprint", handleAfterPrint);
    return () => window.removeEventListener("afterprint", handleAfterPrint);
  }, []);

  const handleDownload = (weekId) => {
    setPrintWeekId(weekId);
    setTimeout(() => {
      window.print();
    }, 150);
  };

  // prefill from personal (non-shared) storage for convenience
  useEffect(() => {
    (async () => {
      try {
        const raw = localStorage.getItem("cei_last_session");
        if (raw) setPrefill(JSON.parse(raw));
      } catch (e) {
        /* no previous session */
      }
    })();
  }, []);

  const goRegister = () => setView("register");

  const handleRegister = async (nama, nim) => {
    let rec;
    try {
      rec = await rpc("register_student", { p_nim: sanitizeNim(nim), p_nama: nama });
    } catch (e) {
      alert("Gagal terhubung ke server: " + e.message);
      return;
    }
    rec.scores = { ...emptyScores(), ...(rec.scores || {}) };
    try { localStorage.setItem("cei_last_session", JSON.stringify({ nama, nim })); } catch (e) {}
    setStudent({ nama, nim: rec.nim });
    setRecord(rec);
    setView("menu");
  };

  const handleLogout = () => {
    setStudent(null);
    setRecord(null);
    setView("landing");
  };

  const openTest = (weekId, type) => {
    setActiveWeekId(weekId);
    setActiveType(type);
    setView("test");
  };

  const submitTest = async (result) => {
    const updated = {
      ...record,
      scores: {
        ...record.scores,
        [activeWeekId]: {
          ...record.scores[activeWeekId],
          [activeType]: { ...result, completedAt: new Date().toISOString() },
        },
      },
    };
    setRecord(updated);
    setLastResult(result);
    try {
      await rpc("save_score", { p_nim: record.nim, p_week: activeWeekId, p_type: activeType, p_result: updated.scores[activeWeekId][activeType] });
    } catch (e) {
      alert("⚠️ Hasil tes belum tersimpan ke server (" + e.message + "). Coba kumpulkan lagi atau hubungi admin.");
    }
    setView("result");
  };

  const loadLeaderboard = async () => {
    setLbLoading(true);
    const all = await fetchAllStudents();
    setStudents(all);
    setLbLoading(false);
  };

  const loadAdmin = async (pw = adminPw) => {
    setLbLoading(true);
    try {
      setStudents((await rpc("admin_students", { pw })) || []);
      setLbLoading(false);
      return true;
    } catch (e) {
      setLbLoading(false);
      return false;
    }
  };

  const adminLogin = async (pw) => {
    const ok = await loadAdmin(pw);
    if (ok) { setAdminPw(pw); setAdminOk(true); }
    return ok;
  };

  useEffect(() => {
    if (view === "leaderboard") loadLeaderboard();
    if (view === "admin" && adminOk) loadAdmin();
  }, [view]);

  if (view === "landing") {
    return (
      <>
        <FontStyles />
        <LandingScreen onStart={goRegister} onLeaderboard={() => setView("leaderboard")} onDownload={handleDownload} />
        <PrintableWeek week={WEEKS.find((w) => w.id === printWeekId)} />
        <button
          onClick={() => setView("admin")}
          className="fixed bottom-4 right-4 flex items-center gap-1.5 rounded-full border border-slate-300 bg-white/90 px-3 py-1.5 text-xs font-semibold text-slate-500 shadow-sm hover:bg-white"
        >
          <ShieldCheck size={13} /> Admin
        </button>
      </>
    );
  }

  if (view === "register") {
    return (
      <>
        <FontStyles />
        <RegisterScreen onRegister={handleRegister} prefill={prefill} />
      </>
    );
  }

  const activeWeek = WEEKS.find((w) => w.id === activeWeekId);

  return (
    <div className="min-h-screen bg-amber-50">
      <FontStyles />
      <NavBar view={view} setView={setView} student={student} onLogout={handleLogout} />
      {view === "menu" && (record ? (
        <MenuScreen record={record} onOpenTest={openTest} onDownload={handleDownload} />
      ) : (
        <div className="mx-auto max-w-md px-4 py-20 text-center f-body">
          <p className="text-sm text-slate-500">Silakan check-in dengan nama dan NIM terlebih dahulu.</p>
          <button
            onClick={() => setView("register")}
            className="mt-4 rounded-full bg-slate-900 px-6 py-3 text-sm font-bold text-amber-50 hover:bg-slate-800"
          >
            Check-in Sekarang
          </button>
        </div>
      ))}
      {view === "test" && activeWeek && (
        <TestScreen week={activeWeek} type={activeType} onSubmit={submitTest} onCancel={() => setView("menu")} />
      )}
      {view === "result" && activeWeek && lastResult && (
        <ResultScreen
          result={lastResult}
          week={activeWeek}
          type={activeType}
          onMenu={() => setView("menu")}
          onDashboard={() => setView("dashboard")}
        />
      )}
      {view === "dashboard" && (record ? (
        <DashboardScreen record={record} />
      ) : (
        <div className="mx-auto max-w-md px-4 py-20 text-center f-body">
          <p className="text-sm text-slate-500">Silakan check-in dengan nama dan NIM terlebih dahulu untuk melihat dashboard.</p>
          <button
            onClick={() => setView("register")}
            className="mt-4 rounded-full bg-slate-900 px-6 py-3 text-sm font-bold text-amber-50 hover:bg-slate-800"
          >
            Check-in Sekarang
          </button>
        </div>
      ))}
      {view === "leaderboard" && <LeaderboardScreen loading={lbLoading} students={students} />}
      {view === "admin" && (
        <AdminScreen
          authed={adminOk}
          onLogin={adminLogin}
          onLogout={() => { setAdminOk(false); setAdminPw(""); setStudents([]); setView(student ? "menu" : "landing"); }}
          students={students}
          loading={lbLoading}
          onRefresh={() => loadAdmin()}
        />
      )}
      <PrintableWeek week={WEEKS.find((w) => w.id === printWeekId)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
